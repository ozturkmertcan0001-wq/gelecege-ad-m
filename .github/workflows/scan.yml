ilanlar = [
    {
        "id": 1,
        "kurum": "Türkiye Cumhuriyeti Cumhurbaşkanlığı Kariyer Kapısı",
        "kadro": "Bölüm Şartsız Düz Memur (2001/3001/4001)",
        "sektor": "Kamu / Bakanlıklar",
        "tarih": datetime.now().strftime("%Y-%m-%d %H:%M"),
        "link": "https://isealimkariyerkapisi.cbiko.gov.tr",
        "aciklama": "Merkezi kamu kurumları ve bakanlık büro personeli alımı.",
        "tip": "Canlı İlan"
    },
    {
        "id": 2,
        "kurum": "İŞKUR Kamu İlanları Portalı",
        "kadro": "Belediye ve Kamu Kurumu Personel Alımı",
        "sektor": "Belediyeler & İştirakler",
        "tarih": datetime.now().strftime("%Y-%m-%d %H:%M"),
