        "tip": "Canlı İlan"
    }
]

# ilanlar.json dosyasını güvenle oluştur ve kaydet
dosya_adi = "ilanlar.json"
try:
    with open(dosya_adi, "w", encoding="utf-8") as f:
        json.dump(ilanlar, f, ensure_ascii=False, indent=4)
