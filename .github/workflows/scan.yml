name: Gelecege Adim Tarama Botu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yükle
        run: pip install requests beautifulsoup4

      - name: Botu Çalıştır
        run: python bot.py
