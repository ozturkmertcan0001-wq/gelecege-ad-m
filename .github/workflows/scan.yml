name: Gelecege Adim Tarama Botu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yukle
        run: pip install requests beautifulsoup4

      - name: Botu Calistir
        run: python bot.py

      - name: Ilanlari Kaydet ve Yayinla
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ilanlar.json
          git diff --staged --quiet || (git commit -m "Otomatik ilan guncellemesi" && git push)
