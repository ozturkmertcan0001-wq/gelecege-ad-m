name: Saatlik Ilan Taramasi

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara-ve-kaydet:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri ve tarayici motorunu kur
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Ilanlari tara
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Sonuclari kaydet
        run: |
          git config user.name "Otomatik Tarayici"
          git config user.email "bot@users.noreply.github.com"
          git add ilanlar.json
          git diff --staged --quiet || git commit -m "Ilan listesi guncellendi"
          git push
